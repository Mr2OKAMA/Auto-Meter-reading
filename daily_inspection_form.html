<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日常点検フォーム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        .prev-value {
            font-size: 0.75rem;
            color: #9ca3af;
            margin-top: 2px;
            padding: 2px 4px;
            background-color: #f3f4f6;
            border-radius: 4px;
            display: inline-block;
        }
        .input-group {
            margin-bottom: 1rem;
        }
        .facility-card {
            transition: all 0.2s ease;
        }
        .facility-card:active {
            transform: scale(0.98);
        }
        input[type="number"],
        input[type="text"],
        input[type="time"],
        input[type="date"] {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e5e7eb;
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        input[type="number"]:focus,
        input[type="text"]:focus,
        input[type="time"]:focus,
        input[type="date"]:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .btn {
            padding: 0.875rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-size: 1rem;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-primary {
            background-color: #3b82f6;
            color: white;
        }
        .btn-primary:hover {
            background-color: #2563eb;
        }
        .btn-secondary {
            background-color: #f3f4f6;
            color: #374151;
            border: 2px solid #d1d5db;
        }
        .btn-secondary:hover {
            background-color: #e5e7eb;
        }
        .file-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }
        .file-input-label {
            display: block;
            padding: 0.875rem 1.5rem;
            background-color: #f0f9ff;
            border: 2px dashed #0ea5e9;
            border-radius: 0.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            color: #0369a1;
            font-weight: 500;
        }
        .file-input-label:hover {
            background-color: #e0f2fe;
        }
        #fileInput {
            display: none;
        }
        .status-message {
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }
        .status-success {
            background-color: #dcfce7;
            color: #166534;
            border-left: 4px solid #22c55e;
        }
        .status-info {
            background-color: #e0f2fe;
            color: #0c4a6e;
            border-left: 4px solid #0ea5e9;
        }
        .comparison-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }
        @media (max-width: 640px) {
            .comparison-row {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen py-4 px-4 max-w-2xl mx-auto">
        <!-- ヘッダー -->
        <div class="mb-6">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">日常点検フォーム</h1>
            <p class="text-gray-600 text-sm">各施設のメーター値を入力してください</p>
        </div>

        <!-- ステータスメッセージ -->
        <div id="statusMessage" class="status-message status-info" style="display: none;"></div>

        <!-- 前回JSONファイル読込セクション -->
        <div class="bg-white rounded-lg shadow p-4 mb-6">
            <h2 class="text-lg font-semibold text-gray-700 mb-3">前回のデータを読み込む</h2>
            <div class="file-input-wrapper">
                <label for="fileInput" class="file-input-label">
                    📄 JSONファイルを選択またはドラッグ&ドロップ
                </label>
                <input type="file" id="fileInput" accept=".json" />
            </div>
            <p class="text-xs text-gray-500 mt-2">inspection_summary_*.json ファイルを選択してください</p>
        </div>

        <!-- フォーム -->
        <form id="inspectionForm" class="space-y-4">
            <!-- 点検日時セクション -->
            <div class="bg-white rounded-lg shadow p-4">
                <h2 class="text-lg font-semibold text-gray-700 mb-4">点検日時</h2>
                <div class="input-group">
                    <label class="block text-sm font-medium text-gray-700 mb-2">点検日</label>
                    <input type="date" id="inspectionDate" required />
                </div>
                <div class="input-group">
                    <label class="block text-sm font-medium text-gray-700 mb-2">点検時間</label>
                    <input type="time" id="inspectionTime" required />
                </div>
            </div>

            <!-- 施設入力セクション -->
            <div id="facilitiesContainer" class="space-y-4">
                <!-- 施設A -->
                <div class="bg-white rounded-lg shadow p-4 facility-card">
                    <h3 class="text-lg font-bold text-blue-600 mb-4">🏭 処理場A</h3>
                    <div class="comparison-row">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">流量 (m³/h)</label>
                            <input type="number" id="flowA" placeholder="0" step="0.1" required />
                            <div id="prevFlowA" class="prev-value"></div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">電力 (kWh)</label>
                            <input type="number" id="powerA" placeholder="0" step="0.1" required />
                            <div id="prevPowerA" class="prev-value"></div>
                        </div>
                    </div>
                </div>

                <!-- 施設B -->
                <div class="bg-white rounded-lg shadow p-4 facility-card">
                    <h3 class="text-lg font-bold text-green-600 mb-4">🏭 処理場B</h3>
                    <div class="comparison-row">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">流量 (m³/h)</label>
                            <input type="number" id="flowB" placeholder="0" step="0.1" required />
                            <div id="prevFlowB" class="prev-value"></div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">電力 (kWh)</label>
                            <input type="number" id="powerB" placeholder="0" step="0.1" required />
                            <div id="prevPowerB" class="prev-value"></div>
                        </div>
                    </div>
                </div>

                <!-- 施設C -->
                <div class="bg-white rounded-lg shadow p-4 facility-card">
                    <h3 class="text-lg font-bold text-orange-600 mb-4">🏭 処理場C</h3>
                    <div class="comparison-row">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">流量 (m³/h)</label>
                            <input type="number" id="flowC" placeholder="0" step="0.1" required />
                            <div id="prevFlowC" class="prev-value"></div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">電力 (kWh)</label>
                            <input type="number" id="powerC" placeholder="0" step="0.1" required />
                            <div id="prevPowerC" class="prev-value"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ボタングループ -->
            <div class="flex gap-3 mt-8 mb-4">
                <button type="submit" class="btn btn-primary flex-1">💾 JSONファイルとして保存</button>
                <button type="reset" class="btn btn-secondary flex-1">🔄 リセット</button>
            </div>
        </form>
    </div>

    <script>
        // 今日の日付を自動設定
        function initializeDateAndTime() {
            const today = new Date();
            const dateStr = today.toISOString().split('T')[0];
            const hours = String(today.getHours()).padStart(2, '0');
            const minutes = String(today.getMinutes()).padStart(2, '0');
            const timeStr = `${hours}:${minutes}`;
            
            document.getElementById('inspectionDate').value = dateStr;
            document.getElementById('inspectionTime').value = timeStr;
        }

        // ファイル読込機能
        const fileInput = document.getElementById('fileInput');
        fileInput.addEventListener('change', handleFileSelect);

        // ドラッグ&ドロップ機能
        const fileLabel = document.querySelector('.file-input-label');
        fileLabel.addEventListener('dragover', (e) => {
            e.preventDefault();
            fileLabel.style.backgroundColor = '#cffafe';
        });
        fileLabel.addEventListener('dragleave', () => {
            fileLabel.style.backgroundColor = '#f0f9ff';
        });
        fileLabel.addEventListener('drop', (e) => {
            e.preventDefault();
            fileLabel.style.backgroundColor = '#f0f9ff';
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileInput.files = files;
                handleFileSelect();
            }
        });

        function handleFileSelect() {
            const file = fileInput.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const jsonData = JSON.parse(e.target.result);
                    loadPreviousValues(jsonData);
                    showStatus('前回のデータを読み込みました', 'success');
                } catch (error) {
                    showStatus('ファイルの読込に失敗しました。正しいJSON形式ですか？', 'error');
                    console.error('JSON Parse Error:', error);
                }
            };
            reader.readAsText(file);
        }

        function loadPreviousValues(jsonData) {
            if (!jsonData.データ一覧 || !Array.isArray(jsonData.データ一覧)) {
                console.warn('Invalid JSON structure');
                return;
            }

            const facilities = {
                '処理場A': { flow: 'prevFlowA', power: 'prevPowerA' },
                '処理場B': { flow: 'prevFlowB', power: 'prevPowerB' },
                '処理場C': { flow: 'prevFlowC', power: 'prevPowerC' }
            };

            jsonData.データ一覧.forEach(item => {
                const facilityName = item.施設名;
                if (facilities[facilityName]) {
                    const ids = facilities[facilityName];
                    const flowEl = document.getElementById(ids.flow);
                    const powerEl = document.getElementById(ids.power);
                    
                    if (flowEl) {
                        flowEl.innerHTML = `前回値: ${item.流量} m³/h`;
                        flowEl.style.display = 'block';
                    }
                    if (powerEl) {
                        powerEl.innerHTML = `前回値: ${item.電力} kWh`;
                        powerEl.style.display = 'block';
                    }
                }
            });
        }

        function showStatus(message, type) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status-message status-${type === 'error' ? 'error' : type === 'success' ? 'success' : 'info'}`;
            statusEl.style.display = 'block';
            
            setTimeout(() => {
                statusEl.style.display = 'none';
            }, 3000);
        }

        // フォーム送信（JSON保存）
        document.getElementById('inspectionForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const inspectionDate = document.getElementById('inspectionDate').value;
            const inspectionTime = document.getElementById('inspectionTime').value;

            const data = {
                '点検日': inspectionDate,
                '点検時間': inspectionTime,
                'データ一覧': [
                    {
                        '施設名': '処理場A',
                        '流量': parseFloat(document.getElementById('flowA').value) || 0,
                        '電力': parseFloat(document.getElementById('powerA').value) || 0
                    },
                    {
                        '施設名': '処理場B',
                        '流量': parseFloat(document.getElementById('flowB').value) || 0,
                        '電力': parseFloat(document.getElementById('powerB').value) || 0
                    },
                    {
                        '施設名': '処理場C',
                        '流量': parseFloat(document.getElementById('flowC').value) || 0,
                        '電力': parseFloat(document.getElementById('powerC').value) || 0
                    }
                ]
            };

            // ファイル名生成（YYYYMMDD形式）
            const dateObj = new Date(inspectionDate);
            const dateStr = dateObj.toISOString().split('T')[0].replace(/-/g, '');
            const filename = `inspection_summary_${dateStr}.json`;

            // JSONファイルダウンロード
            const jsonString = JSON.stringify(data, null, 2);
            const blob = new Blob([jsonString], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            showStatus(`✅ ${filename} をダウンロードしました`, 'success');
        });

        // 初期化
        initializeDateAndTime();
    </script>
</body>
</html>
