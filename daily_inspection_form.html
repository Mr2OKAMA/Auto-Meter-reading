<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日常点検フォーム</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    input[type="number"], input[type="time"], input[type="date"] { width: 100%; padding: .75rem; border: 2px solid #e5e7eb; border-radius: .5rem; font-size: 1rem; }
    input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
    .prev-value { display: none; margin-top: 4px; padding: 3px 6px; border-radius: 4px; background: #f3f4f6; color: #6b7280; font-size: .75rem; }
    .time-actions { display: none; margin-top: .5rem; }
    .time-actions.visible { display: block; }
    .now-button { width: 100%; padding: .65rem .75rem; border: 1px solid #93c5fd; border-radius: .5rem; background: #eff6ff; color: #1d4ed8; font-weight: 600; }
    .now-button:active { background: #dbeafe; transform: scale(.98); }
    .btn { padding: .875rem 1.5rem; border-radius: .5rem; font-weight: 600; cursor: pointer; border: none; font-size: 1rem; }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-primary:hover { background: #2563eb; }
    .btn-secondary { background: #f3f4f6; color: #374151; border: 2px solid #d1d5db; }
    .btn-secondary:hover { background: #e5e7eb; }
    .btn-draft { background: #0f766e; color: white; }
    .btn-draft:hover { background: #115e59; }
    .btn-danger { background: #fff; color: #b91c1c; border: 1px solid #fecaca; }
    .file-input-label { display: block; padding: .875rem 1.5rem; background: #f0f9ff; border: 2px dashed #0ea5e9; border-radius: .5rem; text-align: center; cursor: pointer; color: #0369a1; font-weight: 500; }
    #fileInput { display: none; }
    .status-message { padding: .75rem; border-radius: .5rem; margin-bottom: 1rem; font-size: .875rem; }
    .status-success { background: #dcfce7; color: #166534; border-left: 4px solid #22c55e; }
    .status-info { background: #e0f2fe; color: #0c4a6e; border-left: 4px solid #0ea5e9; }
    .status-error { background: #fee2e2; color: #991b1b; border-left: 4px solid #ef4444; }
    .draft-status { color: #047857; font-size: .75rem; min-height: 1.25rem; }
  </style>
</head>
<body class="bg-gray-50">
  <div class="min-h-screen py-4 px-4 max-w-2xl mx-auto">
    <div class="mb-6">
      <h1 class="text-3xl font-bold text-gray-800 mb-2">日常点検フォーム</h1>
      <p class="text-gray-600 text-sm">各施設の点検時間・メーター値を入力してください</p>
    </div>

    <div id="statusMessage" class="status-message status-info" style="display:none"></div>

    <div class="bg-white rounded-lg shadow p-4 mb-6">
      <h2 class="text-lg font-semibold text-gray-700 mb-3">前回のデータを読み込む</h2>
      <label for="fileInput" class="file-input-label">📄 JSONファイルを選択またはドラッグ&ドロップ</label>
      <input type="file" id="fileInput" accept=".json,application/json">
      <p class="text-xs text-gray-500 mt-2">inspection_summary_*.json ファイルを選択してください</p>
    </div>

    <div class="bg-teal-50 border border-teal-200 rounded-lg p-4 mb-6">
      <h2 class="text-lg font-semibold text-teal-800 mb-2">一時保存</h2>
      <p class="text-sm text-teal-700 mb-3">入力中の内容はこのブラウザに自動保存されます。ブラウザを閉じても、次回アクセス時に復元できます。</p>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
        <button type="button" id="saveDraftButton" class="btn btn-draft">💾 一時保存</button>
        <button type="button" id="restoreDraftButton" class="btn btn-secondary">↩️ 復元</button>
        <button type="button" id="clearDraftButton" class="btn btn-danger">🗑️ 一時保存を削除</button>
      </div>
      <p id="draftStatus" class="draft-status mt-2"></p>
    </div>

    <form id="inspectionForm" class="space-y-4">
      <div class="bg-white rounded-lg shadow p-4">
        <h2 class="text-lg font-semibold text-gray-700 mb-4">点検日</h2>
        <label class="block text-sm font-medium text-gray-700 mb-2" for="inspectionDate">点検日</label>
        <input type="date" id="inspectionDate" required>
      </div>

      <div class="space-y-4">
        <div class="bg-white rounded-lg shadow p-4">
          <h3 class="text-lg font-bold text-blue-600 mb-4">🏭 処理場A</h3>
          <div class="space-y-4">
            <div><label class="block text-sm font-medium text-gray-700 mb-2" for="timeA">点検時間</label><input type="time" id="timeA" required><div id="actionsA" class="time-actions"><button type="button" class="now-button" data-time-id="timeA">🕒 現在時間を入力</button></div><div id="prevTimeA" class="prev-value"></div></div>
            <div><label class="block text-sm font-medium text-gray-700 mb-2" for="flowA">流量 (m³/h)</label><input type="number" id="flowA" placeholder="0" step="0.1" required><div id="prevFlowA" class="prev-value"></div></div>
            <div><label class="block text-sm font-medium text-gray-700 mb-2" for="powerA">電力 (kWh)</label><input type="number" id="powerA" placeholder="0" step="0.1" required><div id="prevPowerA" class="prev-value"></div></div>
          </div>
        </div>

        <div class="bg-white rounded-lg shadow p-4">
          <h3 class="text-lg font-bold text-green-600 mb-4">🏭 処理場B</h3>
          <div class="space-y-4">
            <div><label class="block text-sm font-medium text-gray-700 mb-2" for="timeB">点検時間</label><input type="time" id="timeB" required><div id="actionsB" class="time-actions"><button type="button" class="now-button" data-time-id="timeB">🕒 現在時間を入力</button></div><div id="prevTimeB" class="prev-value"></div></div>
            <div><label class="block text-sm font-medium text-gray-700 mb-2" for="flowB">流量 (m³/h)</label><input type="number" id="flowB" placeholder="0" step="0.1" required><div id="prevFlowB" class="prev-value"></div></div>
            <div><label class="block text-sm font-medium text-gray-700 mb-2" for="powerB">電力 (kWh)</label><input type="number" id="powerB" placeholder="0" step="0.1" required><div id="prevPowerB" class="prev-value"></div></div>
          </div>
        </div>

        <div class="bg-white rounded-lg shadow p-4">
          <h3 class="text-lg font-bold text-orange-600 mb-4">🏭 処理場C</h3>
          <div class="space-y-4">
            <div><label class="block text-sm font-medium text-gray-700 mb-2" for="timeC">点検時間</label><input type="time" id="timeC" required><div id="actionsC" class="time-actions"><button type="button" class="now-button" data-time-id="timeC">🕒 現在時間を入力</button></div><div id="prevTimeC" class="prev-value"></div></div>
            <div><label class="block text-sm font-medium text-gray-700 mb-2" for="flowC">流量 (m³/h)</label><input type="number" id="flowC" placeholder="0" step="0.1" required><div id="prevFlowC" class="prev-value"></div></div>
            <div><label class="block text-sm font-medium text-gray-700 mb-2" for="powerC">電力 (kWh)</label><input type="number" id="powerC" placeholder="0" step="0.1" required><div id="prevPowerC" class="prev-value"></div></div>
          </div>
        </div>
      </div>

      <div class="flex gap-3 mt-8 mb-4">
        <button type="submit" class="btn btn-primary flex-1">📥 JSONファイルとして保存</button>
        <button type="reset" class="btn btn-secondary flex-1">🔄 リセット</button>
      </div>
    </form>
  </div>

  <script>
    const facilities = {
      '処理場A': { key: 'A', time: 'timeA', flow: 'flowA', power: 'powerA' },
      '処理場B': { key: 'B', time: 'timeB', flow: 'flowB', power: 'powerB' },
      '処理場C': { key: 'C', time: 'timeC', flow: 'flowC', power: 'powerC' }
    };
    const DRAFT_STORAGE_KEY = 'auto_meter_reading_inspection_draft_v1';
    let draftTimer;

    function localDateString(date = new Date()) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }

    function currentTimeString() {
      const now = new Date();
      return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }

    function initializeForm() {
      document.getElementById('inspectionDate').value = localDateString();
      ['timeA', 'timeB', 'timeC'].forEach(id => document.getElementById(id).value = '');
    }

    function showStatus(message, type = 'info') {
      const status = document.getElementById('statusMessage');
      status.textContent = message;
      status.className = `status-message status-${type}`;
      status.style.display = 'block';
      setTimeout(() => status.style.display = 'none', 3000);
    }

    function getDraftData() {
      return {
        savedAt: new Date().toISOString(),
        '点検日': document.getElementById('inspectionDate').value,
        'データ一覧': Object.entries(facilities).map(([name, config]) => ({
          '施設名': name,
          '点検時間': document.getElementById(config.time).value,
          '流量': document.getElementById(config.flow).value,
          '電力': document.getElementById(config.power).value
        }))
      };
    }

    function hasDraftInput(data) {
      return Boolean(data && (data['点検日'] || (Array.isArray(data['データ一覧']) && data['データ一覧'].some(item => item['点検時間'] || item['流量'] || item['電力']))));
    }

    function saveDraft(showMessage = true) {
      try {
        localStorage.setItem(DRAFT_STORAGE_KEY, JSON.stringify(getDraftData()));
        const savedAt = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('draftStatus').textContent = `一時保存済み（${savedAt}）`;
        if (showMessage) showStatus('入力内容を一時保存しました', 'success');
      } catch (error) {
        console.error(error);
        if (showMessage) showStatus('一時保存に失敗しました。ブラウザの保存領域を確認してください', 'error');
      }
    }

    function readDraft() {
      try {
        const raw = localStorage.getItem(DRAFT_STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (error) {
        console.error(error);
        return null;
      }
    }

    function restoreDraft(showMessage = true) {
      const draft = readDraft();
      if (!draft || !hasDraftInput(draft)) {
        if (showMessage) showStatus('復元できる一時保存データがありません', 'info');
        return false;
      }
      if (draft['点検日']) document.getElementById('inspectionDate').value = draft['点検日'];
      if (Array.isArray(draft['データ一覧'])) {
        draft['データ一覧'].forEach(item => {
          const config = facilities[item['施設名']];
          if (!config) return;
          document.getElementById(config.time).value = item['点検時間'] || '';
          document.getElementById(config.flow).value = item['流量'] || '';
          document.getElementById(config.power).value = item['電力'] || '';
        });
      }
      const savedAt = draft.savedAt ? new Date(draft.savedAt).toLocaleString('ja-JP') : '日時不明';
      document.getElementById('draftStatus').textContent = `一時保存済み（${savedAt}）`;
      if (showMessage) showStatus('一時保存データを復元しました', 'success');
      return true;
    }

    function clearDraft(showMessage = true) {
      localStorage.removeItem(DRAFT_STORAGE_KEY);
      document.getElementById('draftStatus').textContent = '';
      if (showMessage) showStatus('一時保存データを削除しました', 'success');
    }

    function scheduleDraftSave() {
      clearTimeout(draftTimer);
      draftTimer = setTimeout(() => saveDraft(false), 300);
    }

    ['A', 'B', 'C'].forEach(key => {
      const timeInput = document.getElementById(`time${key}`);
      const actions = document.getElementById(`actions${key}`);
      timeInput.addEventListener('focus', () => actions.classList.add('visible'));
      timeInput.addEventListener('click', () => actions.classList.add('visible'));
      document.querySelector(`[data-time-id="time${key}"]`).addEventListener('click', () => {
        timeInput.value = currentTimeString();
        actions.classList.add('visible');
        saveDraft(false);
        showStatus(`処理場${key}の点検時間に現在時刻を入力しました`, 'success');
      });
    });

    document.querySelectorAll('#inspectionForm input').forEach(input => {
      input.addEventListener('input', scheduleDraftSave);
      input.addEventListener('change', scheduleDraftSave);
    });

    document.getElementById('saveDraftButton').addEventListener('click', () => saveDraft(true));
    document.getElementById('restoreDraftButton').addEventListener('click', () => restoreDraft(true));
    document.getElementById('clearDraftButton').addEventListener('click', () => {
      if (confirm('一時保存データを削除しますか？')) clearDraft(true);
    });

    function handleFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = event => {
        try {
          loadPreviousValues(JSON.parse(event.target.result));
          showStatus('前回のデータを読み込みました', 'success');
        } catch (error) {
          console.error(error);
          showStatus('ファイルの読込に失敗しました。正しいJSON形式ですか？', 'error');
        }
      };
      reader.readAsText(file);
    }

    document.getElementById('fileInput').addEventListener('change', event => handleFile(event.target.files[0]));
    const fileLabel = document.querySelector('.file-input-label');
    fileLabel.addEventListener('dragover', event => { event.preventDefault(); fileLabel.style.backgroundColor = '#cffafe'; });
    fileLabel.addEventListener('dragleave', () => fileLabel.style.backgroundColor = '#f0f9ff');
    fileLabel.addEventListener('drop', event => { event.preventDefault(); fileLabel.style.backgroundColor = '#f0f9ff'; handleFile(event.dataTransfer.files[0]); });

    function loadPreviousValues(jsonData) {
      if (!Array.isArray(jsonData.データ一覧)) throw new Error('データ一覧がありません');
      jsonData.データ一覧.forEach(item => {
        const config = facilities[item.施設名];
        if (!config) return;
        [[`prevTime${config.key}`, `前回値: ${item.点検時間 || '未記録'}`], [`prevFlow${config.key}`, `前回値: ${item.流量} m³/h`], [`prevPower${config.key}`, `前回値: ${item.電力} kWh`]].forEach(([id, text]) => {
          const element = document.getElementById(id);
          element.textContent = text;
          element.style.display = 'block';
        });
      });
    }

    document.getElementById('inspectionForm').addEventListener('submit', event => {
      event.preventDefault();
      const date = document.getElementById('inspectionDate').value;
      const data = {
        '点検日': date,
        'データ一覧': Object.entries(facilities).map(([name, config]) => ({
          '施設名': name,
          '点検時間': document.getElementById(config.time).value,
          '流量': parseFloat(document.getElementById(config.flow).value),
          '電力': parseFloat(document.getElementById(config.power).value)
        }))
      };
      const filename = `inspection_summary_${date.replace(/-/g, '')}.json`;
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      clearDraft(false);
      showStatus(`✅ ${filename} をダウンロードしました。一時保存を削除しました`, 'success');
    });

    document.getElementById('inspectionForm').addEventListener('reset', () => {
      setTimeout(() => {
        document.querySelectorAll('.prev-value').forEach(element => { element.textContent = ''; element.style.display = 'none'; });
        document.querySelectorAll('.time-actions').forEach(element => element.classList.remove('visible'));
        clearDraft(false);
        initializeForm();
      }, 0);
    });

    window.addEventListener('beforeunload', () => saveDraft(false));

    initializeForm();
    const existingDraft = readDraft();
    if (existingDraft && hasDraftInput(existingDraft)) {
      const savedAt = existingDraft.savedAt ? new Date(existingDraft.savedAt).toLocaleString('ja-JP') : '日時不明';
      document.getElementById('draftStatus').textContent = `一時保存あり（${savedAt}）`;
      setTimeout(() => {
        if (confirm(`一時保存データ（${savedAt}）を復元しますか？`)) restoreDraft(true);
      }, 100);
    }
  </script>
</body>
</html>
